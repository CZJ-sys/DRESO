dataset:
  - well.active_matter
num_trajectories: 2000
num_validation_samples: 200
model_name: L
lr: 0.00005
weight_decay: 0.000001
lr_scheduler: cosine
warmup_ratio: 0.03
num_epochs: 80
batch_size: 8
gradient_accumulation_steps: 1
max_grad_norm: 5.0
train_time_step_size: 1
train_small_time_transition: true
fft_norm: forward
spectral_filter_cutoff: 0.25
spectral_mixer_init_scale: 0.02
spectral_region_gate_hidden: 64
spectral_gate_temperature: 1.0
spectral_gate_floor: 0.25
spectral_gate_prior_weight: 1.0
use_hf_loss: true
hf_loss_lambda: 0.3
hf_loss_alpha: 1.5
